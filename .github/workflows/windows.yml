name: Windows client
on:
  workflow_dispatch:
  push:
    paths: ['LICENSE', 'windows/**', 'bridge/**', 'Resources/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['LICENSE', 'windows/**', 'bridge/**', 'Resources/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    # The self-test also downloads Parakeet (about 661 MB) and runs it, on top of the two Whisper models.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Core safety checks, Windows build, and package
        shell: pwsh
        run: ./windows/scripts/build.ps1 -OutputDirectory "${{ github.workspace }}/artifacts"
      - name: Install package with Windows PowerShell 5.1
        shell: powershell
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Sona-windows-x64.zip'
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          & ./windows/scripts/install.ps1 -PackagePath $package -Sha256 $hash -NoLaunch
      - name: Windows native engine, bridge, and owned-window smoke test
        shell: pwsh
        run: |
          $qa = Join-Path $env:GITHUB_WORKSPACE 'artifacts/qa'
          New-Item -ItemType Directory -Path $qa -Force | Out-Null
          $report = Join-Path $qa 'windows-selftest.json'
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'windows/tests/Fixtures/jfk.wav'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Sona/Sona.exe'
          $process = Start-Process -FilePath $installed -ArgumentList '--self-test', "`"$report`"", '--fixture', "`"$fixture`"" -PassThru
          if (-not $process.WaitForExit(1200000)) { Stop-Process -Id $process.Id; throw 'Windows self-test exceeded twenty minutes.' }
          if (Test-Path $report) {
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) { throw "Windows self-test failed: $($process.ExitCode)" }
          & ./windows/scripts/assert-runtime-qa.ps1 -Report $report
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem windows/scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Recording panel preview renders
        # After the self-test, so a preview failure cannot skip it, and run even if it failed so the renders still land.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $panel = Join-Path $env:GITHUB_WORKSPACE 'artifacts/qa/panel'
          New-Item -ItemType Directory -Path $panel -Force | Out-Null
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Sona/Sona.exe'
          $process = Start-Process -FilePath $installed -ArgumentList '--panel-preview', "`"$panel`"" -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw 'Panel preview exceeded two minutes.' }
          $failure = Join-Path $panel 'panel-preview-error.txt'
          if (Test-Path $failure) { Get-Content $failure }
          if ($process.ExitCode -ne 0) { throw "Panel preview failed: $($process.ExitCode)" }
          foreach ($name in 'recording-dark', 'recording-light', 'processing-dark', 'processing-light') {
            $png = Join-Path $panel "$name.png"
            if (-not (Test-Path $png)) { throw "Panel preview did not write $name.png" }
            Write-Host "$name.png $((Get-Item $png).Length) bytes"
          }
          # The credit is the Mac's script logo, not text. Renders are 824x398 px at 200% with the glass at DIP (56, 39).
          # Where "Intelligence" sits (glass x 200 to 265, y 80 to 98) the logo is chalk on dark and black on light; the
          # old text credit drew it in blue. The ink ends at the logo's right edge, glass x 286 (pixel 684).
          Add-Type -AssemblyName System.Drawing
          foreach ($theme in 'dark', 'light') {
            $image = [System.Drawing.Bitmap]::new((Join-Path $panel "recording-$theme.png"))
            try {
              if ($image.Width -ne 824 -or $image.Height -ne 398) { throw "recording-$theme.png is $($image.Width)x$($image.Height), not 824x398" }
              $fill = $image.GetPixel(152, 256) # Plain glass left of the credit.
              if (($theme -eq 'dark') -ne (([int]$fill.R + $fill.G + $fill.B) -lt 384)) { throw "recording-$theme.png glass is $fill, not a $theme fill" }
              $word = 0; $right = -1
              for ($y = 238; $y -le 274; $y++) {
                for ($x = 512; $x -le 642; $x++) {
                  $p = $image.GetPixel($x, $y)
                  $low = [Math]::Min([Math]::Min([int]$p.R, [int]$p.G), [int]$p.B)
                  $high = [Math]::Max([Math]::Max([int]$p.R, [int]$p.G), [int]$p.B)
                  if ($theme -eq 'dark' -and $low -ge 170 -and ($high - $low) -le 30) { $word++ }
                  if ($theme -eq 'light' -and $high -le 60) { $word++ }
                }
                # The logo's right edge spans rows 251 to 258. Below row 260 the glass's rounded corner and edge
                # light reach x 700, so the edge scan stops there.
                if ($y -le 260) {
                  for ($x = 600; $x -le 700; $x++) {
                    $p = $image.GetPixel($x, $y)
                    $difference = [Math]::Abs([int]$p.R - $fill.R) + [Math]::Abs([int]$p.G - $fill.G) + [Math]::Abs([int]$p.B - $fill.B)
                    if ($difference -gt 40 -and $x -gt $right) { $right = $x }
                  }
                }
              }
              Write-Host "recording-$theme.png credit: $word logo pixels where Intelligence sits, ink right edge at x $right"
              if ($word -lt 100) { throw "recording-$theme.png: the credit is not the script logo ($word chalk or black pixels where Intelligence sits, need 100)" }
              if ($right -lt 680 -or $right -gt 686) { throw "recording-$theme.png: the credit ink ends at x $right, not at the logo's right edge (680 to 686)" }
            }
            finally { $image.Dispose() }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sona-windows-x64
          path: |
            artifacts/Sona-windows-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/install-windows.ps1
            artifacts/qa/windows-selftest.json
            artifacts/qa/panel/*.png
          if-no-files-found: warn
